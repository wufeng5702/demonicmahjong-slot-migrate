# This file contains the configuration for this project.
# If you change `info`, also update the generated assets under `build/`
# (build/windows/info.json, build/windows/wails.exe.manifest, NSIS/MSIX metadata).
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "wufeng5702" # The name of the company
  productName: "DemonicMahjong Slot Migrate" # The name of the application
  productIdentifier: "com.wufeng5702.demonicmahjong-slot-migrate" # The unique product identifier
  description: "将安卓版《我在地府打麻将》的存档迁移到 Steam 版本" # The application description
  copyright: "(c) 2025, wufeng5702" # Copyright text
  comments: "DemonicMahjong Slot Migrate" # Comments
  version: "0.1.0" # The application version

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js" # Watch for changes to JS/TS files included using the //wails:include directive.
      - "*.ts" # The frontend directory will be excluded entirely by the setting above.
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

# File Associations
# More information at: https://v3.wails.io/noit/done/yet
fileAssociations:
